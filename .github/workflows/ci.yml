name: Build and Test

on: 
  push: 
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.puthon-version }})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-lastest, windows-latest, macos-latest]
        python-version: [ '3.12', '3.13', '3.14' ]

    steps: 
      - uses: actions/checkout@v5

      - name : Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      
      - name : Verify installation
        run: encoder --help

      - name: Run tests
        run: pytest